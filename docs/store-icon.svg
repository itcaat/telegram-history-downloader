  <!-- Download badge -->
  <circle cx="98" cy="98" r="25" fill="#fff"/>
  <circle cx="98" cy="98" r="21" fill="url(#badge)"/>
  <g fill="none" stroke="#fff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M98 87v15"/>
