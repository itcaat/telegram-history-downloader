name: Release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Parse semver tag
        id: version
        run: |
          TAG="${GITHUB_REF_NAME}"
          SEMVER_RE='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$'
          if [[ ! "$TAG" =~ $SEMVER_RE ]]; then
            echo "::error::Tag '$TAG' is not a valid semver tag (expected vX.Y.Z[-prerelease][+build])"
            exit 1
          fi
          echo "full=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "core=${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.${BASH_REMATCH[3]}" >> "$GITHUB_OUTPUT"
          if [[ -n "${BASH_REMATCH[4]}" ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Stable releases must have the version committed (make release does it),
      # so the repo source matches what gets published to the Chrome Web Store.
      - name: Check committed version
        if: steps.version.outputs.prerelease == 'false'
        env:
          VERSION_FULL: ${{ steps.version.outputs.full }}
        run: |
          MANIFEST="$(node -p 'require("./public/manifest.json").version')"
          PACKAGE="$(node -p 'require("./package.json").version')"
          if [[ "$MANIFEST" != "$VERSION_FULL" || "$PACKAGE" != "$VERSION_FULL" ]]; then
            echo "::error::Tag is v$VERSION_FULL, but manifest.json has $MANIFEST and package.json has $PACKAGE. Use 'make release' or commit the version before tagging."
            exit 1
          fi

      - name: Set version
        run: node scripts/set-version.mjs "${{ steps.version.outputs.full }}"

      - run: npm run build

      - name: Package extension
        id: package
        run: |
          ZIP="telegram-history-downloader-${GITHUB_REF_NAME}.zip"
          (cd dist && zip -r "../$ZIP" .)
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          ZIP: ${{ steps.package.outputs.zip }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: |
          FLAGS=(--title "$GITHUB_REF_NAME" --generate-notes --verify-tag)
          if [[ "$PRERELEASE" == "true" ]]; then
            FLAGS+=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" "$ZIP" "${FLAGS[@]}"
